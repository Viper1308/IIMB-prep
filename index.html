<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IIMB Prep</title>
<style>
/* Master shell: a slim top bar with one tab per day; the selected day's page fills the rest of the screen. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#13202b; --muted:#566574; --line:#d9e0e6; --accent:#0a6c70;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e151c; --surface:#16212b; --fg:#e7edf2; --muted:#9aa9b7; --line:#263644; --accent:#4fc4c0; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--surface)}
header h1{margin:0;font-size:1rem;font-weight:800;letter-spacing:.02em;white-space:nowrap}
#tabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0}
#tabs button{flex:none;font:600 .82rem system-ui,sans-serif;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
#tabs button[aria-current="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#frame{flex:1;width:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<header>
  <h1>IIMB Prep</h1>
  <div id="tabs" role="tablist"></div>
</header>
<iframe id="frame" title="Day content"></iframe>
<script>
// To add a day: drop the file in /days and add one line here.
const DAYS = [
  { id: 'day1', label: 'Day 1', src: 'days/day1.html' },
  { id: 'day2', label: 'Day 2', src: 'days/day2.html' }
];

const tabs = document.getElementById('tabs');
const frame = document.getElementById('frame');
const LAST = 'iimb-master-last';

function open(id) {
  const d = DAYS.find(x => x.id === id) || DAYS[DAYS.length - 1];
  frame.src = d.src;
  tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === d.id)));
  document.title = 'IIMB Prep, ' + d.label;
  history.replaceState(null, '', '#' + d.id);
  try { localStorage.setItem(LAST, d.id); } catch (e) {}
}

DAYS.forEach(d => {
  const b = document.createElement('button');
  b.textContent = d.label;
  b.dataset.id = d.id;
  b.setAttribute('role', 'tab');
  b.onclick = () => open(d.id);
  tabs.appendChild(b);
});

let start = location.hash.slice(1);
if (!start) { try { start = localStorage.getItem(LAST) || ''; } catch (e) {} }
open(start);
</script>
</body>
</html>
